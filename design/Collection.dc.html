<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>EKA Yoga – облекла и аксесоари</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&amp;family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F0E4}
a{color:#5D7054;text-decoration:none}a:hover{color:#AF5D65}
button{font-family:inherit}
.eka-check input{appearance:none;-webkit-appearance:none;box-sizing:border-box;margin:0;width:18px;height:18px;flex:none;background:#F3F0E4;border:1px solid #5D7054;border-radius:4px;cursor:pointer}
.eka-check input:hover{border-width:2px}
.eka-check input:checked{background:#5D7054;box-shadow:inset 0 0 0 3px #F3F0E4}
.eka-check input:focus-visible{outline:2px solid #5D7054;outline-offset:2px}
.flt-cat{display:none}
.flt-cat-list{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.flt-cat-btn{height:40px;padding:0;border:0;border-bottom:2px solid transparent;background:transparent;color:#5D7054;font-size:16px;font-weight:400;cursor:pointer}
.flt-cat-btn[aria-pressed="true"]{font-weight:700;border-bottom-color:#AF5D65}
.flt-cat-btn:focus-visible{outline:2px solid #5D7054;outline-offset:2px}
.flt-m{display:none}
.flt-m fieldset{border:0;margin:0;padding:0}
.flt-m legend,.flt-cat legend{padding:0;margin-bottom:12px;font-size:18px !important;font-weight:400 !important}
.flt-row{display:flex;flex-wrap:wrap;gap:16px;justify-content:flex-start}
.flt-swb,.flt-szb{box-sizing:border-box;width:52px;height:52px;padding:0;border:1px solid transparent;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.flt-swb span{display:block;width:44px;height:44px}
.flt-szb{border:1px solid #5D7054;border-radius:4px;color:#5D7054;font-size:16px;font-weight:900}
.flt-szb[aria-pressed="true"]{background:#5D7054;color:#FFFFFF}
.flt-swb:focus-visible,.flt-szb:focus-visible,.flt-act:focus-visible{outline:2px solid #5D7054;outline-offset:2px}
.flt-link{align-self:flex-start;margin-top:16px;padding:0;border:0;background:none;color:#5D7054;font-size:16px;text-decoration:underline;cursor:pointer}
.flt-act{box-sizing:border-box;width:100%;height:56px;border-radius:8px;font:700 16px/1.5 Lato,'Helvetica Neue',Arial,sans-serif;cursor:pointer}
.flt-act--primary{border:0;background:#AF5D65;color:#FFFFFF}
.flt-act--secondary{height:58px;border:2px solid #5D7054;background:transparent;color:#5D7054}
@media (max-width:767px){

main button[aria-haspopup="dialog"]{margin-left:auto !important;padding-right:0 !important}
.flt-cat{display:block}
aside[aria-labelledby="flt-title"] > div{padding:16px !important;gap:24px !important}
.flt-d{display:none !important}
.flt-m{display:flex;flex-direction:column;gap:24px}
.flt-cat-list{align-items:stretch}
.flt-cat-btn{width:100%;height:56px;text-align:left;font-size:18px;border-bottom:1px solid transparent}
.flt-cat-btn[aria-pressed="true"]{border-bottom:1px solid #AF5D65}
.flt-cat-btn{display:flex;align-items:center;gap:12px}
.flt-cat-btn::before{content:'';flex:none;box-sizing:border-box;width:18px;height:18px;border:1px solid #5D7054;border-radius:4px;background:#F3F0E4}
.flt-cat-btn[aria-pressed="true"]::before{background:#5D7054;box-shadow:inset 0 0 0 2px #F3F0E4}

</helmet>
<div style="position: relative; font-family: Lato, 'Helvetica Neue', Arial, sans-serif; color: #5D7054; background: #F3F0E4; width: 100%; min-width: 0">
<dc-import name="Header" variant="solid" count="{{ cartCount }}" hint-size="100%,110px"></dc-import>
<main style="width: 100%; box-sizing: border-box; margin: 0 auto; padding: 0 64px 120px">
<nav aria-label="Път" style="font-size: 14px; margin-bottom: 24px"><a href="Main.dc.html">EKA Yoga</a> <span aria-hidden="true">›</span> Облекла и аксесоари</nav>
<h1 style="margin: 0; padding: 80px 0; font-family: &quot;Cormorant Garamond&quot;, Garamond, Georgia, serif; font-size: 56px; font-weight: 700; line-height: 1; text-align: center; padding-top: 16px; padding-bottom: 32px; letter-spacing: -1.12px; font-style: normal">Облекла и аксесоари</h1>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; border-bottom: 1px solid #E3E7DC; margin-bottom: 40px">
<div role="tablist" aria-label="Категории" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
</sc-for>
</div>
<button type="button" aria-haspopup="dialog" aria-expanded="{{ filterOpen }}" onClick="{{ openFilter }}" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border: 0; background: transparent; color: #5D7054; font-size: 16px; font-weight: 700; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 7h10M17 7h4M3 17h4M11 17h10"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></svg>Филтри<sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #AF5D65; color: #FFFFFF; font-size: 12px; display: inline-flex; align-items: center; justify-content: center">{{ activeCount }}</span></sc-if></button>
</div>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
<p style="margin: 40px 0; text-align: center; font-size: 18px">Няма продукти с избраните филтри.</p>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 48px 16px">
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="14">
<div style="{{ c.cell }}"><dc-import name="ProductCard" item="{{ c }}" hint-size="100%,560px"></dc-import></div>
</sc-for>
</div>
</main>
<dc-import name="PreFooter" hint-size="100%,1900px"></dc-import>
<dc-import name="Footer" hint-size="100%,970px"></dc-import>
<dc-import name="SizeGuide" item="{{ sizeGuide }}" hint-size="100%,0px"></dc-import>
<sc-if value="{{ filterOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 20">
<button type="button" aria-label="Затворете филтрите" onClick="{{ closeFilter }}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: rgba(0,0,0,0.3); cursor: pointer"></button>
<aside role="dialog" aria-modal="true" aria-labelledby="flt-title" style="position: absolute; top: 0; right: 0; width: 400px; height: 100%; box-sizing: border-box; background: #F3F0E4; border-left: 1px solid #5D7054">
<div style="position: sticky; top: 0; padding: 32px 32px 40px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="flt-title" style="margin: 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 40px; font-weight: 700; line-height: 1.2">Филтри</h2>
<button type="button" aria-label="Затворете филтрите" onClick="{{ closeFilter }}" style="width: 44px; height: 44px; border: 0; background: transparent; color: #5D7054; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg></button>
</div>
<fieldset class="flt-cat" style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 20px; font-weight: 700">Категория</legend>
<div class="flt-cat-list">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<button type="button" class="flt-cat-btn" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}</button>
</sc-for>
</div>
</fieldset>
<fieldset class="flt-d" style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 16px; font-size: 20px; font-weight: 700">Цвят</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px">
<sc-for list="{{ colorOpts }}" as="o" hint-placeholder-count="4">
<label class="eka-check" style="display: flex; align-items: center; gap: 12px; font-size: 16px; cursor: pointer"><input type="checkbox" checked="{{ o.on }}" onChange="{{ o.toggle }}"><span style="{{ o.swatch }}"></span>{{ o.label }}</label>
</sc-for>
</div>
</fieldset>
<fieldset class="flt-d" style="border: 0; margin: 0; padding: 0">
<legend style="padding: 0; margin-bottom: 16px; font-size: 20px; font-weight: 700">Размер</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px">
<sc-for list="{{ sizeOpts }}" as="o" hint-placeholder-count="4">
<label class="eka-check" style="display: flex; align-items: center; gap: 12px; font-size: 16px; cursor: pointer"><input type="checkbox" checked="{{ o.on }}" onChange="{{ o.toggle }}">{{ o.label }}</label>
</sc-for>
</div>
</fieldset>
<div class="flt-m">
<fieldset><legend>Цвят</legend><div class="flt-row">
<sc-for list="{{ colorOptsM }}" as="o" hint-placeholder-count="4"><button type="button" class="flt-swb" aria-label="{{ o.label }}" aria-pressed="{{ o.on }}" onClick="{{ o.toggle }}" style="{{ o.frame }}"><span style="{{ o.fill }}"></span></button></sc-for>
</div></fieldset>
<fieldset><legend>Размер</legend><div class="flt-row">
<sc-for list="{{ sizeOptsM }}" as="o" hint-placeholder-count="3"><button type="button" class="flt-szb" aria-pressed="{{ o.on }}" onClick="{{ o.toggle }}">{{ o.label }}</button></sc-for>
</div><button type="button" class="flt-link" onClick="{{ openSize }}">Таблица с размери</button></fieldset>
<div class="flt-actions"><button type="button" class="flt-act flt-act--primary" onClick="{{ closeFilter }}">Приложи филтър</button><button type="button" class="flt-act flt-act--secondary" onClick="{{ clear }}">Изчисти филтрите</button></div>
</div>
<div class="flt-d" style="display: flex; flex-direction: column; gap: 24px; align-items: stretch">
<button type="button" onClick="{{ clear }}" style="align-self: flex-start; height: 44px; padding: 0; border: 0; border-bottom: 1px solid #AF5D65; background: transparent; color: #5D7054; font-size: 16px; font-weight: 700; cursor: pointer">Изчистете филтрите</button>
<button type="button" onClick="{{ closeFilter }}" style="height: 56px; border: 0; border-radius: 8px; background: #AF5D65; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Покажи {{ count }} {{ countWord }}</button>
</div>
</div>
</aside>
</div>
</sc-if>
</div>
</x-dc>
