<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>EKA Yoga – комплект</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&amp;family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F0E4}
a{color:#5D7054;text-decoration:none}a:hover{color:#AF5D65}
button{font-family:inherit}
.eka-btn{box-sizing:border-box;height:56px;min-width:200px;padding:0 24px;border:0;border-radius:8px;background:none;color:#5D7054;font:700 16px/1.5 Lato,'Helvetica Neue',Arial,sans-serif;cursor:pointer}
.eka-btn:focus-visible{outline:2px solid #5D7054;outline-offset:2px}
.eka-btn--primary{background:#AF5D65;color:#FFFFFF}.eka-btn--primary:hover{background:#C3737B}
.eka-btn--secondary{border:2px solid #5D7054;height:58px}
.eka-btn--third{height:auto;min-width:0;padding:0 0 2px;border-bottom:1px solid transparent;border-radius:0;color:#AF5D65;font-weight:700}.eka-btn--third:hover{border-bottom-color:#AF5D65}
@media (max-width:767px){
main{padding-top:0 !important}
main > nav[aria-label="Път"]{display:none}
img[style*="aspect-ratio: 616 / 398"]{width:calc(100% + 32px) !important;max-width:none;margin:0 -16px;aspect-ratio:1 / 1 !important}
main h1{margin-top:8px !important;font-size:28px !important}
main fieldset{margin-top:24px !important}
main .eka-btn{width:100%;min-width:0}
main [style*="max-width: 520px"]{max-width:none !important}
main.set-main{padding-left:0 !important;padding-right:0 !important}
main.set-main > .eka-split{padding-left:16px !important;padding-right:16px !important;box-sizing:border-box}
main.set-main > .eka-split img{width:calc(100% + 32px) !important;margin:0 -16px !important}
main.set-main > section.set-more{padding-left:16px !important;padding-right:16px !important;box-sizing:border-box}
main.set-main > section.set-more > div{padding:0 !important;margin:0 !important}
}
</style>
</helmet>
<div style="font-family: Lato, 'Helvetica Neue', Arial, sans-serif; color: #5D7054; background: #F3F0E4; width: 100%; min-width: 0">
<dc-import name="Header" variant="solid" count="{{ cartCount }}" hint-size="100%,110px"></dc-import>
<main class="set-main" style="width: 100%; margin: 0 auto; padding: 24px 64px 0; box-sizing: border-box">
<nav aria-label="Път" style="font-size: 14px; margin-bottom: 32px"><a href="Main.dc.html">EKA Yoga</a> <span aria-hidden="true">›</span> <a href="Sets.dc.html">Комплекти</a> <span aria-hidden="true">›</span> {{ setName }}</nav>
<div class="eka-split" style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 32px; align-items: start">
<div>
<img src="{{ mainImg }}" alt="{{ mainAlt }}" style="width: 100%; aspect-ratio: 616 / 398; object-fit: cover; display: block; background: #E3E7DC">
</div>
<div style="display: flex; flex-direction: column; align-items: flex-start; padding-top: 8px; position: sticky; top: 24px">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 40px; font-weight: 700; line-height: 1.2">{{ setName }}</h1>
<p style="margin: 4px 0 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 32px; font-style: italic; font-weight: 700; line-height: 1.2; font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1">€ {{ price }}</p>
<fieldset style="border: 0; margin: 32px 0 0; padding: 0">
<legend style="padding: 0; margin-bottom: 12px; font-size: 16px; font-weight: 700">Цвят: <span style="font-weight: 400">{{ colorName }}</span></legend>
<div style="display: flex; align-items: center; gap: 10px">
<sc-for list="{{ swatches }}" as="sw" hint-placeholder-count="4">
<button type="button" aria-label="{{ sw.label }}" aria-pressed="{{ sw.on }}" onClick="{{ sw.pick }}" style="{{ sw.outer }}"><span style="{{ sw.inner }}"></span></button>
</sc-for>
</div>
</fieldset>
<div style="margin-top: 32px; display: flex; flex-direction: column; gap: 12px">
<span id="qty-label" style="font-size: 16px; font-weight: 700">Количество</span>
<div role="group" aria-labelledby="qty-label" style="display: inline-flex; align-items: center; width: 200px; height: 48px; box-sizing: border-box; border: 1px solid #5D7054; border-radius: 8px; background: #F3F0E4">
<button type="button" aria-label="Намалете количеството" onClick="{{ dec }}" style="width: 48px; height: 46px; border: 0; background: transparent; color: #5D7054; font-size: 22px; cursor: pointer">−</button>
<span aria-live="polite" style="flex: 1; text-align: center; font-size: 16px">{{ qty }}</span>
<button type="button" aria-label="Увеличете количеството" onClick="{{ inc }}" style="width: 48px; height: 46px; border: 0; background: transparent; color: #5D7054; font-size: 22px; cursor: pointer">+</button>
</div>
</div>
<div style="margin-top: 24px; display: flex; flex-direction: column; gap: 16px; align-self: stretch; max-width: 520px">
<button type="button" class="eka-btn eka-btn--primary" onClick="{{ add }}">{{ addLabel }}</button>
<button type="button" class="eka-btn eka-btn--secondary">Купете сега</button>
</div>
<div style="margin-top: 32px; align-self: stretch; max-width: 520px; display: flex; flex-direction: column; gap: 16px; font-family: Lato, 'Helvetica Neue', Arial, sans-serif; font-size: 18px; font-weight: 400; line-height: 1.5">
<p style="margin: 0">{{ setDesc }}</p>
<p style="margin: 0">[ОПИСАНИЕ НА КОМПЛЕКТА – предстои]</p>
</div>
</div>
</div>
<section class="set-more" aria-labelledby="h-sets" style="padding-top: 40px">
<h2 id="h-sets" style="margin: 0; padding: 80px 0; text-align: center; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 56px; font-weight: 700; line-height: 1.2">EKA комплекти</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{ sets }}" as="s" hint-placeholder-count="2">
<dc-import name="ProductCard" item="{{ s }}" hint-size="100%,640px"></dc-import>
</sc-for>
</div>
</section>
<section class="set-more" aria-labelledby="h-others" style="padding-top: 0">
<h2 id="h-others" style="margin: 0; padding: 80px 0; text-align: center; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 56px; font-weight: 700; line-height: 1.2">Други от колекцията</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{ others }}" as="c" hint-placeholder-count="3">
<dc-import name="ProductCard" item="{{ c }}" hint-size="100%,560px"></dc-import>
</sc-for>
</div>
</section>
</main>
<dc-import name="PreFooter" hint-size="100%,1900px"></dc-import>
<dc-import name="Footer" hint-size="100%,970px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 4200}}'>
const COLORS={"red": ["Бордо", "#AE2958"], "green": ["Маслина", "#819886"], "blue": ["Синьо", "#518398"], "yellow": ["Жълто", "#D7B955"]};
const COLOR_ORDER=["red", "yellow", "green", "blue"];
const SETS_DATA={
  mf: { name: "Мандала Флоу", price: 119, desc: "Тениска с мандала, шорти за йога и възглавничка за очи",
        imgs: { red: "/_blob/4b2c28e4f989199308029601dc600947", yellow: "/_blob/04189649e4187644d82490ccfd7eed7c", green: "/_blob/e0f91baba5cbec7ac0151f9419c6883b", blue: "/_blob/0e4c5e09c22c0bb5e377c325b0798768" } },
  er: { name: "Елегантен ритуал", price: 123, desc: "Гащеризон за йога и възглавничка за очи",
        imgs: { red: "/_blob/b2e9ff69ad1cd803ba5d22d92c7be0c2", yellow: "/_blob/af93716d43d2fa3b26719a883dc378e3", green: "/_blob/3135c6f93fe1c970b28dd1924f979f3a", blue: "/_blob/6cdb13f8febcf8bd3e0d5c3d00b5c645" } }
};
const OTHERS=[{"name": "Шорти за йога", "price": 49, "colors": ["red", "green", "blue"], "sel": "red", "imgs": {"red": "/_blob/44840115dca5c67fdee6425f3544b944", "green": "/_blob/11650be921363287e207215abe97d956", "blue": "/_blob/415a518488630e407d3efc99ce3338c1"}}, {"name": "Тениска с мандала", "price": 45, "colors": ["red", "yellow", "green", "blue"], "sel": "blue", "imgs": {"red": "/_blob/3abb67916041bbc92bff2de99e40eabd", "yellow": "/_blob/fbf118d9e38a7157fae5b9c2a2316fcc", "green": "/_blob/2b012b0a84ecff993caa9e11b51de151", "blue": "/_blob/d953a323b5a5c66cd9aebaf0776b3235"}}, {"name": "Възглавничка за очи", "price": 36, "colors": ["red", "green", "blue", "yellow"], "sel": "green", "imgs": {"red": "/_blob/465c46c9b9cc853ce3cd66519f128ebf", "green": "/_blob/0ba7055cba356bc154772efaca14ff3e", "blue": "/_blob/7eb7e6afce8af337a316672f366206ee", "yellow": "/_blob/e7c30da2a8c86c500389ea676a9e2159"}}];
function sq(on, hex){ return { outer: 'width: 32px; height: 32px; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; border: 1px solid ' + (on ? hex : 'transparent'),
  inner: 'display: block; background: ' + hex + '; width: ' + (on ? '22px' : '24px') + '; height: ' + (on ? '22px' : '24px') }; }
const SET_CARD_COLOR = { mf: 'blue', er: 'yellow' };
function currentColor(){ try { var c = new URLSearchParams(window.location.search).get('color'); if (c && COLORS[c]) return c; } catch (err) {} return 'red'; }
function currentSet(){ try { var k = new URLSearchParams(window.location.search).get('set'); if (k && SETS_DATA[k]) return k; } catch (err) {} return 'mf'; }
class Component extends DCLogic {
  renderVals() {
    var self = this, st = this.state, key = currentSet(), S = SETS_DATA[key], col = st.color || currentColor(), qty = st.qty || 1, added = st.added || 0;
    var swatches = COLOR_ORDER.map(function(c){ var s = sq(c === col, COLORS[c][1]); return { label: COLORS[c][0], on: c === col, outer: s.outer, inner: s.inner,
      pick: function(){ self.setState({ color: c }); } }; });
    var others = OTHERS.map(function(p, i){ var sel = (st.osel || {})[i] || p.sel;
      return { name: p.name, price: p.price, href: 'Product.dc.html', img: p.imgs[sel] || p.imgs[p.sel], alt: p.name + ', цвят ' + COLORS[sel][0].toLowerCase(), ratio: '3 / 4',
        swatches: p.colors.map(function(c){ return { label: COLORS[c][0], hex: COLORS[c][1], on: c === sel,
          pick: function(){ var o = Object.assign({}, self.state.osel || {}); o[i] = c; self.setState({ osel: o }); } }; }) }; });
    var sets = Object.keys(SETS_DATA).map(function(k){ var s = SETS_DATA[k];
      return { name: s.name, desc: s.desc, price: s.price, href: 'Sets.dc.html', img: s.imgs[SET_CARD_COLOR[k]], ratio: '616 / 398',
        alt: s.name + ', цвят ' + COLORS[SET_CARD_COLOR[k]][0].toLowerCase(), swatches: [{ label: COLORS[SET_CARD_COLOR[k]][0], hex: COLORS[SET_CARD_COLOR[k]][1], on: true }] }; });
    return { cartCount: 2 + added, setName: S.name, setDesc: S.desc, price: S.price,
      mainImg: S.imgs[col], mainAlt: S.name + ', цвят ' + COLORS[col][0].toLowerCase(), colorName: COLORS[col][0],
      swatches: swatches, sets: sets, others: others, qty: qty,
      dec: function(){ self.setState({ qty: Math.max(1, qty - 1) }); }, inc: function(){ self.setState({ qty: qty + 1 }); },
      addLabel: added ? 'Добавено в количката' : 'Добавете в количката', add: function(){ self.setState({ added: added + qty }); } };
  }
}
</script>
</body>
</html>
