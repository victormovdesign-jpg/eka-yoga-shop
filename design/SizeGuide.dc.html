<style>
body{margin:0}
.sg-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.sg-backdrop{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:rgba(93,112,84,0.6);cursor:pointer}
.sg-panel{position:relative;box-sizing:border-box;width:min(960px,100%);max-height:calc(100vh - 48px);overflow:auto;padding:40px 56px;border-radius:16px;background:#F3F0E4;color:#5D7054;font-family:Lato,'Helvetica Neue',Arial,sans-serif}
.sg-close{position:absolute;top:24px;right:24px;width:48px;height:48px;margin:0;padding:0;border:0;background:transparent;color:#5D7054;font-size:36px;line-height:1;cursor:pointer}
.sg-close:hover{color:#AF5D65}
.sg-close:focus-visible,.sg-backdrop:focus-visible{outline:2px solid #5D7054;outline-offset:2px}
.sg-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center}
.sg-figwrap{position:relative;height:506px;aspect-ratio:1180 / 3564;margin-left:16px}
.sg-fig{display:block;width:100%;height:100%}
.sg-badge{position:absolute;transform:translate(-50%,-50%);box-sizing:border-box;width:24px;height:24px;margin:0;padding:0;border-radius:50%;background:#AF5D65;color:#FFFFFF;font-family:Lato,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.sg-brand{margin:0;font-family:'Cormorant Garamond',Garamond,Georgia,serif;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:0.08em}
.sg-title{margin:4px 0 0;font-family:'Cormorant Garamond',Garamond,Georgia,serif;font-size:44px;font-weight:700;line-height:1.1}
.sg-table-wrap{overflow-x:auto;margin-top:20px}
.sg-table{width:100%;border-collapse:collapse;font-size:18px;line-height:1.5}
.sg-table th,.sg-table td{padding:12px;border-bottom:1px solid #5D7054;text-align:left;vertical-align:middle}
.sg-table thead th{font-size:16px;font-weight:700}
.sg-table .sg-num{text-align:center;white-space:nowrap}
.sg-table tbody th{font-weight:400}
.sg-table tbody th .sg-badge{position:static;transform:none;vertical-align:middle;margin-right:12px}
.sg-unit{margin:12px 0 0;font-size:14px}
.sg-note{margin:8px 0 0;font-size:16px;line-height:1.5}
@media (max-width:767px){
.sg-overlay{padding:12px}
.sg-panel{max-height:calc(100vh - 24px);padding:40px 20px}
.sg-close{top:12px;right:12px}
.sg-body{grid-template-columns:minmax(0,1fr);gap:24px}
.sg-figwrap{height:330px;margin:0 auto}
.sg-brand{font-size:20px}
.sg-title{font-size:32px}
.sg-table{font-size:16px}
.sg-table th,.sg-table td{padding:10px 6px}
.sg-table tbody th .sg-badge{margin-right:8px}
}
</style>
