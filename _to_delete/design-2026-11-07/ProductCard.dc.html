<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>EKA_Product-Card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&amp;family=Lato:wght@400;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<article style="font-family: Lato, 'Helvetica Neue', Arial, sans-serif; color: #5D7054; display: flex; flex-direction: column; min-width: 0; width: 100%">
<a href="{{ item.href }}" onClick="{{ click }}" onPointerDown="{{ down }}" onPointerUp="{{ up }}" onPointerLeave="{{ leave }}" style="{{ linkStyle }}"><img src="{{ img }}" alt="{{ alt }}" draggable="false" style="{{ imgStyle }}">
<sc-if value="{{ hasGal }}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 6px; pointer-events: none">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="3"><span style="{{ d.style }}"></span></sc-for>
</span>
</sc-if></a>
<sc-if value="{{ hasSwatches }}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="Цвят" style="display: flex; align-items: center; gap: 10px; padding: 14px 8px 0">
<sc-for list="{{ swatches }}" as="sw" hint-placeholder-count="3">
<button type="button" aria-label="{{ sw.label }}" aria-pressed="{{ sw.on }}" onClick="{{ sw.pick }}" style="{{ sw.outer }}"><span style="{{ sw.inner }}"></span></button>
</sc-for>
</div>
</sc-if>
<h3 style="margin: 0; padding: 16px 8px 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 32px; font-weight: 700; line-height: 1.2"><a href="{{ item.href }}" style="color: #5D7054; text-decoration: none">{{ item.name }}</a></h3>
<sc-if value="{{ hasDesc }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 8px 8px 0; font-family: Lato, 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 400; line-height: 1.5">{{ item.desc }}</p>
</sc-if>
<sc-if value="{{ showPrice }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; padding: 20px 8px 0; font-family: 'Cormorant Garamond', Garamond, Georgia, serif; font-size: 32px; font-style: italic; font-weight: 700; line-height: 1.2; font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1">€ {{ item.price }}</p>
</sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":325,"height":560}}'>
var SAMPLE = { name: 'Гащеризон за йога', price: 98, href: 'Product.dc.html', img: '/_blob/a290fae5178691cbf5dff426e9c34d39', alt: 'Цяло йога трико, цвят малина',
  swatches: [{ label: 'Бордо', hex: '#AE2958', on: true }, { label: 'Маслина', hex: '#819886', on: false }, { label: 'Синьо', hex: '#518398', on: false }] };
class Component extends DCLogic {
  renderVals() {
    var item = this.props.item || SAMPLE, self = this;
    var gal = item.gallery && item.gallery.length > 1 ? item.gallery : null;
    var gi = gal ? (((this.state.gi || 0) % gal.length) + gal.length) % gal.length : 0;
    var cur = gal ? gal[gi] : item;
    var swatches = (cur.swatches || item.swatches || []).map(function(s){
      return { label: s.label, on: s.on, pick: s.pick,
        outer: 'width: 32px; height: 32px; padding: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; cursor: pointer; background: transparent; border: 1px solid ' + (s.on ? s.hex : 'transparent'),
        inner: 'display: block; background: ' + s.hex + '; width: ' + (s.on ? '22px' : '24px') + '; height: ' + (s.on ? '22px' : '24px') };
    });
    var dots = gal ? gal.map(function(g, k){ return { style: 'display: block; width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF; opacity: ' + (k === gi ? '1' : '0.5') }; }) : [];
    return { img: cur.img || item.img, alt: cur.alt || item.alt, hasGal: !!gal, dots: dots,
      linkStyle: 'position: relative; display: block; overflow: hidden; background: #E3E7DC; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: ' + (gal ? 'grab' : 'pointer'),
      down: function(e){ self._x = e.clientX; },
      leave: function(){ self._x = null; },
      up: function(e){ if (self._x == null || !gal) return; var dx = e.clientX - self._x; self._x = null;
        if (Math.abs(dx) > 30) { self._dragged = true; self.setState({ gi: (self.state.gi || 0) + (dx < 0 ? 1 : -1) }); } },
      click: function(e){ if (self._dragged) { e.preventDefault(); self._dragged = false; } },
      item: item, swatches: swatches, hasSwatches: swatches.length > 0, hasDesc: !!item.desc, showPrice: !item.hidePrice,
      imgStyle: 'width: 100%; aspect-ratio: ' + (item.ratio || '332 / 396') + '; object-fit: cover; display: block' };
  }
}
</script>
</body>
</html>
